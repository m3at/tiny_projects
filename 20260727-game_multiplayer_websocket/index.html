<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broadside</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1017'/%3E%3Crect x='3' y='20' width='26' height='2' fill='%2315384c'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23d8b25c'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <!-- Top bar: always visible once a match is running -->
    <header id="topbar" class="hidden">
      <!-- Filled in by ui/hud.js once the roster is known: two players read as a duel score,
           three or four as a list. -->
      <div class="score" id="score"></div>
      <div class="round-info">
        <div id="round-label">Round 1</div>
        <div id="hull-label" class="muted">Sloop</div>
      </div>
      <div class="wind">
        <canvas id="wind-dial" width="52" height="52"></canvas>
        <div id="wind-label">Wind</div>
      </div>
      <button id="btn-mute" class="mute">Sound on</button>
      <div id="timer" class="timer"></div>
    </header>

    <!-- Build phase -->
    <section id="build-ui" class="hidden">
      <aside class="panel left framed">
        <div class="panel-head">
          <h2 id="build-who">Player 1</h2>
          <div class="scrap">
            <span id="scrap-value">0</span>
            <span class="muted">scrap</span>
          </div>
        </div>
        <div id="offer" class="offer"></div>
        <div class="tools">
          <button id="btn-reroll" class="tool">Reroll <span class="muted">2</span></button>
          <button id="btn-refit" class="tool">Refit</button>
          <button id="btn-scrap" class="tool" data-tool="remove">Remove</button>
        </div>
        <p id="hint" class="hint"></p>
      </aside>

      <aside class="panel right framed">
        <div id="readout"></div>
        <div id="warnings"></div>
        <div id="enemy-intel" class="hidden">
          <h3 class="label">Last seen</h3>
          <div id="enemy-list"></div>
        </div>
      </aside>

      <div class="build-footer">
        <button id="btn-lock" class="primary">Lock in</button>
      </div>
    </section>

    <!-- Battle phase -->
    <section id="battle-ui" class="hidden">
      <!-- One panel per ship, built by ui/hud.js. Seats alternate sides so a duel keeps the
           left-against-right reading it has always had and a four-way stacks two to a side. -->
      <div id="panels-left" class="panel-col left"></div>
      <div id="panels-right" class="panel-col right"></div>
      <div id="battle-log" class="battle-log"></div>
    </section>

    <!-- Full-screen overlays: menu, handoff, results -->
    <div id="overlay" class="overlay">
      <div class="card framed ticked">
        <h1 id="ov-title">Broadside</h1>
        <p id="ov-body"></p>
        <div id="ov-log" class="ov-log"></div>
        <!-- Anything an overlay needs beyond prose: the menu, the lobby roster, a join code. -->
        <div id="ov-extra"></div>
        <div class="ov-buttons">
          <button id="ov-alt" class="tool hidden"></button>
          <button id="ov-btn" class="primary">Start</button>
        </div>
      </div>
    </div>

    <!-- Wire status. Empty and invisible in a local game. -->
    <div id="netbar" class="netbar hidden"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
