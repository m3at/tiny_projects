[project]
name = "shodo-arm"
version = "0.1.0"
description = "MuJoCo brush-arm learning laboratory with KanjiVG trajectories"
requires-python = ">=3.13,<3.14"
dependencies = ["mujoco>=3.3,<4", "gymnasium>=1.1,<2", "numpy>=2.2,<3", "pillow>=11,<13", "svgpathtools>=1.6,<2", "torch>=2.6,<3", "stable-baselines3>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
shodo = "shodo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shodo"]

[tool.ruff]
line-length = 100

